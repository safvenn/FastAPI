<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Auth Pages */
        .page {
            display: none;
            padding: 50px 40px;
            min-height: 600px;
            animation: fadeIn 0.3s ease-in;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-header p {
            color: #888;
            font-size: 16px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 36px;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 10px;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #f5f7ff;
        }

        .toggle-text {
            text-align: center;
            color: #888;
            font-size: 15px;
            margin-top: 25px;
        }

        .toggle-text a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            font-weight: 700;
            transition: color 0.3s;
        }

        .toggle-text a:hover {
            color: #764ba2;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        /* Dashboard */
        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .dashboard-header button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .dashboard-header button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .dashboard-content {
            padding: 40px;
        }

        .card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .card-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            color: #333;
            font-size: 42px;
            font-weight: 700;
        }

        .add-expense-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px dashed #ddd;
        }

        .add-expense-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .expenses-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
        }

        .expense-item {
            background: #f9f9f9;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-out;
        }

        .expense-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .expense-info h4 {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .expense-info p {
            color: #999;
            font-size: 13px;
        }

        .expense-amount {
            color: #667eea;
            font-size: 20px;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 16px;
        }

        .btn-delete {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #ff6b6b;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-delete:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .page {
                padding: 30px 20px;
                min-height: auto;
            }

            .dashboard-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .card-value {
                font-size: 32px;
            }

            .auth-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Signup Page -->
        <div id="signup-page" class="page active">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Start tracking your expenses today</p>
            </div>
            <div id="signup-error"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signup-confirm" required>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            <div class="toggle-text">
                Already have an account? <a onclick="switchPage('login-page')">Login</a>
            </div>
        </div>

        <!-- Login Page -->
        <div id="login-page" class="page">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your expense tracker</p>
            </div>
            <div id="login-error"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div class="toggle-text">
                Don't have an account? <a onclick="switchPage('signup-page')">Sign Up</a>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-page" class="page">
            <div class="dashboard-header">
                <h1>💰 Expense Tracker</h1>
                <button onclick="logout()">Logout</button>
            </div>
            <div class="dashboard-content">
                <div class="card">
                    <div class="card-label">Total Expenses</div>
                    <div class="card-value">₹<span id="total-amount">0</span></div>
                </div>

                <div class="add-expense-section">
                    <h3>➕ Add New Expense</h3>
                    <form id="add-expense-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Description</label>
                                <input type="text" id="expense-title" placeholder="e.g., Groceries" required>
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select id="expense-category" required>
                                    <option value="">Select a category</option>
                                    <option value="Food">🍔 Food & Dining</option>
                                    <option value="Transport">🚗 Transport</option>
                                    <option value="Shopping">🛍️ Shopping</option>
                                    <option value="Entertainment">🎬 Entertainment</option>
                                    <option value="Utilities">💡 Utilities</option>
                                    <option value="Healthcare">🏥 Healthcare</option>
                                    <option value="Education">📚 Education</option>
                                    <option value="Other">📌 Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Amount (₹)</label>
                                <input type="number" id="expense-amount" placeholder="0" required min="1">
                            </div>
                        </div>
                        <div class="form-row full">
                            <div class="form-group">
                                <label>Details</label>
                                <input type="text" id="expense-description" placeholder="Add more details (optional)">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">Add Expense</button>
                    </form>
                    <div id="add-expense-error"></div>
                </div>

                <div class="expenses-section">
                    <h3>📊 Recent Expenses</h3>
                    <div id="expenses-container">
                        <div class="loading">Loading your expenses...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let authToken = null;
        let currentEmail = null;

        // API Middleware
        const apiMiddleware = {
            async request(method, endpoint, data = null) {
                const headers = {
                    'Content-Type': 'application/json',
                };
                
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                const options = {
                    method,
                    headers,
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                try {
                    const response = await fetch(`${API_URL}${endpoint}`, options);
                    
                    if (response.status === 401) {
                        logout();
                        throw new Error('Unauthorized');
                    }

                    const result = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(result.detail || 'Request failed');
                    }

                    return result;
                } catch (error) {
                    throw error;
                }
            }
        };

        // Page Navigation
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // Signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            if (password !== confirm) {
                showError('signup-error', 'Passwords do not match');
                return;
            }

            if (password.length < 4) {
                showError('signup-error', 'Password must be at least 4 characters');
                return;
            }

            try {
                await apiMiddleware.request('POST', '/signup', { email, username, password });
                showError('signup-error', '');
                showSuccess('login-page', 'Account created! Please login.');
                document.getElementById('signup-form').reset();
                switchPage('login-page');
            } catch (error) {
                showError('signup-error', error.message);
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const data = await apiMiddleware.request('POST', '/login', { email, password });
                authToken = data.access_token;
                currentEmail = email;
                localStorage.setItem('token', authToken);
                localStorage.setItem('email', email);
                showError('login-error', '');
                showDashboard();
            } catch (error) {
                showError('login-error', error.message);
            }
        });

        // Add Expense
        document.getElementById('add-expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('expense-title').value;
            const amount = parseInt(document.getElementById('expense-amount').value);
            const category = document.getElementById('expense-category').value;
            const discription = document.getElementById('expense-description').value;

            try {
                await apiMiddleware.request('POST', '/expense', { title, amount, category, discription });
                document.getElementById('expense-title').value = '';
                document.getElementById('expense-amount').value = '';
                document.getElementById('expense-category').value = '';
                document.getElementById('expense-description').value = '';
                document.getElementById('add-expense-error').innerHTML = '';
                loadExpenses();
            } catch (error) {
                showError('add-expense-error', error.message);
            }
        });

        // Load Expenses
        async function loadExpenses() {
            if (!authToken || !currentEmail) return;

            try {
                const data = await apiMiddleware.request('GET', `/${currentEmail}`);
                document.getElementById('total-amount').textContent = data.total_expense;

                const expenses = data.expenses;
                const container = document.getElementById('expenses-container');

                if (!expenses || expenses.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No expenses yet. Add your first expense to get started!</p></div>';
                    return;
                }

                const categoryIcons = {
                    'Food': '🍔',
                    'Transport': '🚗',
                    'Shopping': '🛍️',
                    'Entertainment': '🎬',
                    'Utilities': '💡',
                    'Healthcare': '🏥',
                    'Education': '📚',
                    'Other': '📌'
                };

                container.innerHTML = expenses.map((exp) => `
                    <div class="expense-item">
                        <div class="expense-info">
                            <h4>${escapeHtml(exp.title)}</h4>
                            <p>${categoryIcons[exp.category] || '📌'} ${escapeHtml(exp.category)}</p>
                            ${exp.discription ? `<p>${escapeHtml(exp.discription)}</p>` : ''}
                        </div>
                        <div style="display: flex; align-items: center; gap: 20px;">
                            <div class="expense-amount">₹${exp.amount}</div>
                            <button class="btn-delete" onclick="deleteExpense(${exp.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('expenses-container').innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        // Delete Expense
        async function deleteExpense(expenseId) {
            if (!confirm('Are you sure you want to delete this expense?')) return;

            try {
                const response = await fetch(`${API_URL}/delete?i=${expenseId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete');
                }

                loadExpenses();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Show Dashboard
        function showDashboard() {
            switchPage('dashboard-page');
            loadExpenses();
        }

        // Logout
        function logout() {
            authToken = null;
            currentEmail = null;
            localStorage.removeItem('token');
            localStorage.removeItem('email');
            document.getElementById('login-form').reset();
            document.getElementById('signup-form').reset();
            switchPage('signup-page');
        }

        // Utilities
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            if (message) {
                element.innerHTML = `<div class="alert alert-error">${escapeHtml(message)}</div>`;
            } else {
                element.innerHTML = '';
            }
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            if (message) {
                const container = document.querySelector(`#${elementId}`);
                const alert = document.createElement('div');
                alert.className = 'alert alert-success';
                alert.textContent = message;
                container.insertAdjacentElement('afterbegin', alert);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Restore session on page load
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('token');
            const savedEmail = localStorage.getItem('email');
            if (savedToken && savedEmail) {
                authToken = savedToken;
                currentEmail = savedEmail;
                showDashboard();
            }
        });

        // Refresh expenses every 15 seconds
        setInterval(() => {
            if (document.getElementById('dashboard-page').classList.contains('active')) {
                loadExpenses();
            }
        }, 15000);
    </script>
</body>
</html>
