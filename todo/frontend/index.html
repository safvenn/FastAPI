<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav id="navbar" class="bg-blue-600 text-white p-4 shadow-lg hidden">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">📝 Todo App</h1>
            <div class="flex items-center gap-4">
                <span id="usernameDisplay" class="text-sm"></span>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <!-- Auth Section -->
        <div id="authSection" class="max-w-md mx-auto mt-8">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <h2 class="text-3xl font-bold text-center mb-8 text-blue-600">Todo App</h2>

                <!-- Error Message -->
                <div id="authError" class="bg-red-100 text-red-700 p-3 rounded mb-4 hidden"></div>

                <!-- Signup Tab -->
                <div id="signupTab" class="mb-6">
                    <h3 class="text-xl font-bold mb-4">Sign Up</h3>
                    <div class="space-y-4">
                        <input 
                            type="text" 
                            id="signupUsername" 
                            placeholder="Username" 
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <input 
                            type="password" 
                            id="signupPassword" 
                            placeholder="Password (max 72 chars)" 
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <button 
                            id="signupBtn" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition"
                        >
                            Sign Up
                        </button>
                    </div>
                    <p class="text-sm text-gray-600 mt-4 text-center">
                        Already have an account? 
                        <button id="switchToLogin" class="text-blue-600 hover:underline font-bold">
                            Login
                        </button>
                    </p>
                </div>

                <!-- Login Tab -->
                <div id="loginTab" class="mb-6 hidden">
                    <h3 class="text-xl font-bold mb-4">Login</h3>
                    <div class="space-y-4">
                        <input 
                            type="text" 
                            id="loginUsername" 
                            placeholder="Username" 
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <input 
                            type="password" 
                            id="loginPassword" 
                            placeholder="Password" 
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <button 
                            id="loginBtn" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition"
                        >
                            Login
                        </button>
                    </div>
                    <p class="text-sm text-gray-600 mt-4 text-center">
                        Don't have an account? 
                        <button id="switchToSignup" class="text-blue-600 hover:underline font-bold">
                            Sign Up
                        </button>
                    </p>
                </div>

                <!-- Success Message -->
                <div id="authSuccess" class="bg-green-100 text-green-700 p-3 rounded hidden"></div>
            </div>
        </div>

        <!-- Todos Section -->
        <div id="todosSection" class="max-w-2xl mx-auto mt-8 hidden">
            <!-- Add Todo Form -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-2xl font-bold mb-4">Add New Todo</h2>
                <div id="addTodoError" class="bg-red-100 text-red-700 p-3 rounded mb-4 hidden"></div>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="todoTitle" 
                        placeholder="Enter todo title..." 
                        class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <button 
                        id="addTodoBtn" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition"
                    >
                        Add
                    </button>
                </div>
            </div>

            <!-- Todos List -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-bold mb-4">Your Todos</h2>
                <div id="todoError" class="bg-red-100 text-red-700 p-3 rounded mb-4 hidden"></div>
                <div id="todoSuccess" class="bg-green-100 text-green-700 p-3 rounded mb-4 hidden"></div>
                <div id="emptyState" class="text-center text-gray-500 py-8">
                    <p class="text-lg">No todos yet. Add one to get started!</p>
                </div>
                <ul id="todoList" class="space-y-3"></ul>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:8000';
        let token = localStorage.getItem('token');
        let currentUsername = localStorage.getItem('username');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            checkAuthStatus();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            // Auth Tab Switching
            document.getElementById('switchToLogin').addEventListener('click', switchToLogin);
            document.getElementById('switchToSignup').addEventListener('click', switchToSignup);

            // Auth Buttons
            document.getElementById('signupBtn').addEventListener('click', signup);
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Todo Buttons
            document.getElementById('addTodoBtn').addEventListener('click', addTodo);

            // Enter key support
            document.getElementById('signupPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') signup();
            });
            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            document.getElementById('todoTitle').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodo();
            });
        }

        // Auth Tab Switching
        function switchToLogin() {
            document.getElementById('signupTab').classList.add('hidden');
            document.getElementById('loginTab').classList.remove('hidden');
            clearAuthMessages();
        }

        function switchToSignup() {
            document.getElementById('loginTab').classList.add('hidden');
            document.getElementById('signupTab').classList.remove('hidden');
            clearAuthMessages();
        }

        // Check Authentication Status
        function checkAuthStatus() {
            if (token && currentUsername) {
                showTodosSection();
                fetchTodos();
            } else {
                showAuthSection();
            }
        }

        // Show/Hide Sections
        function showAuthSection() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('todosSection').classList.add('hidden');
            document.getElementById('navbar').classList.add('hidden');
            clearFormInputs();
        }

        function showTodosSection() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('todosSection').classList.remove('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('usernameDisplay').textContent = `Welcome, ${currentUsername}!`;
        }

        // Signup
        async function signup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;

            clearAuthMessages();

            if (!username || !password) {
                showAuthError('Please fill in all fields');
                return;
            }

            if (password.length > 72) {
                showAuthError('Password is too long (max 72 characters)');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAuthError(data.detail || 'Signup failed');
                    return;
                }

                showAuthSuccess('Signup successful! Please login with your credentials.');
                document.getElementById('signupUsername').value = '';
                document.getElementById('signupPassword').value = '';
                setTimeout(switchToLogin, 2000);
            } catch (error) {
                showAuthError('Network error: ' + error.message);
            }
        }

        // Login
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            clearAuthMessages();

            if (!username || !password) {
                showAuthError('Please fill in all fields');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showAuthError(data.detail || 'Login failed');
                    return;
                }

                // Save token and username
                token = data.access_token;
                currentUsername = username;
                localStorage.setItem('token', token);
                localStorage.setItem('username', username);

                // Switch to todos section
                showTodosSection();
                fetchTodos();
            } catch (error) {
                showAuthError('Network error: ' + error.message);
            }
        }

        // Logout
        function logout() {
            token = null;
            currentUsername = null;
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showAuthSection();
            switchToSignup();
        }

        // Fetch All Todos
        async function fetchTodos() {
            try {
                const response = await fetch(`${API_BASE_URL}/todo`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    // Token expired
                    logout();
                    showAuthError('Session expired. Please login again.');
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    showTodoError(data.detail || 'Failed to fetch todos');
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('todoList').innerHTML = '';
                    return;
                }

                displayTodos(data);
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        // Display Todos
        function displayTodos(todos) {
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');

            if (!todos || todos.length === 0) {
                emptyState.classList.remove('hidden');
                todoList.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            todoList.innerHTML = '';

            todos.forEach(todo => {
                const todoItem = document.createElement('li');
                todoItem.className = 'flex items-center gap-3 p-4 bg-gray-50 rounded border border-gray-200 hover:bg-gray-100 transition';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.disabled = todo.completed;
                checkbox.className = 'w-5 h-5 accent-green-600';
                checkbox.addEventListener('change', () => completeTodo(todo.id));

                const titleSpan = document.createElement('span');
                titleSpan.className = `flex-1 text-lg ${todo.completed ? 'line-through text-gray-400' : 'text-gray-800'}`;
                titleSpan.textContent = todo.title;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'bg-red-500 hover:bg-red-600 text-white font-bold py-1 px-3 rounded text-sm transition';
                deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                todoItem.appendChild(checkbox);
                todoItem.appendChild(titleSpan);
                todoItem.appendChild(deleteBtn);
                todoList.appendChild(todoItem);
            });
        }

        // Add Todo
        async function addTodo() {
            const title = document.getElementById('todoTitle').value.trim();

            clearTodoMessages();

            if (!title) {
                showTodoError('Please enter a todo title');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/addtodo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        completed: false
                    })
                });

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    showAuthError('Session expired. Please login again.');
                    return;
                }

                if (!response.ok) {
                    showTodoError(data.detail || 'Failed to add todo');
                    return;
                }

                showTodoSuccess('Todo added successfully!');
                document.getElementById('todoTitle').value = '';
                fetchTodos();
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        // Complete Todo
        async function completeTodo(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/completed/${id}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    showAuthError('Session expired. Please login again.');
                    return;
                }

                if (!response.ok) {
                    showTodoError(data.detail || 'Failed to complete todo');
                    return;
                }

                showTodoSuccess('Todo marked as completed!');
                fetchTodos();
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        // Delete Todo
        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this todo?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/delete/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    showAuthError('Session expired. Please login again.');
                    return;
                }

                if (!response.ok) {
                    showTodoError(data.detail || 'Failed to delete todo');
                    return;
                }

                showTodoSuccess('Todo deleted successfully!');
                fetchTodos();
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        // Helper Functions - Messages
        function showAuthError(message) {
            document.getElementById('authError').textContent = message;
            document.getElementById('authError').classList.remove('hidden');
        }

        function showAuthSuccess(message) {
            document.getElementById('authSuccess').textContent = message;
            document.getElementById('authSuccess').classList.remove('hidden');
        }

        function showTodoError(message) {
            document.getElementById('todoError').textContent = message;
            document.getElementById('todoError').classList.remove('hidden');
        }

        function showTodoSuccess(message) {
            document.getElementById('todoSuccess').textContent = message;
            document.getElementById('todoSuccess').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('todoSuccess').classList.add('hidden');
            }, 3000);
        }

        function clearAuthMessages() {
            document.getElementById('authError').classList.add('hidden');
            document.getElementById('authSuccess').classList.add('hidden');
        }

        function clearTodoMessages() {
            document.getElementById('addTodoError').classList.add('hidden');
            document.getElementById('todoError').classList.add('hidden');
        }

        function clearFormInputs() {
            document.getElementById('signupUsername').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }
    </script>
</body>
</html>
